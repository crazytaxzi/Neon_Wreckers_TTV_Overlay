name: Verify expedition lifecycle fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tests
        run: |
          pnpm run test:repository
          pnpm run test:api

      - name: Capture affected build results
        id: build
        shell: bash
        run: |
          set +e
          : > tools/expedition-build.log
          status=0
          for command in \
            "pnpm --filter @neon-wreckers/contracts run build" \
            "pnpm run db:generate" \
            "pnpm --filter @neon-wreckers/api run build" \
            "pnpm --filter @neon-wreckers/worker run build" \
            "pnpm --filter @neon-wreckers/admin run build"
          do
            printf '\n$ %s\n' "$command" | tee -a tools/expedition-build.log
            bash -lc "$command" >> tools/expedition-build.log 2>&1
            result=$?
            printf 'exit=%s\n' "$result" | tee -a tools/expedition-build.log
            if [ "$result" -ne 0 ]; then status=$result; fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit diagnostic log
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/expedition-build.log
          git commit -m "Record expedition lifecycle build diagnostics" || true
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Fail when an affected build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
