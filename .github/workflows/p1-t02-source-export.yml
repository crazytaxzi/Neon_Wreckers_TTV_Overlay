name: P1-T02 Source Export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p1-t02-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    name: Export exact checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Create source archive
        shell: bash
        run: git archive --format=zip --output=neon-wreckers-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: p1-t02-source
          path: neon-wreckers-source.zip
          if-no-files-found: error
          retention-days: 1
