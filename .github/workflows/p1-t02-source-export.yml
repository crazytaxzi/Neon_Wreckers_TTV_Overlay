name: P1-T02 Source Transfer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p1-t02-source-export.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed extraction patch
    if: github.head_ref == 'agent/p1-t02-server-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/p1-t02.patch
          git apply --check /tmp/p1-t02.patch
          git apply /tmp/p1-t02.patch
          git add apps/admin/src/main.tsx apps/admin/src/features/server/server-page.tsx tools/test/admin-server-feature.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(admin): extract server diagnostics'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
