name: Apply crew portraits and retired deletion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply feature patch when needed
        shell: bash
        run: |
          if grep -q 'crew-portrait-picker' apps/web/src/pages/fleet.tsx; then
            echo 'Feature patch already applied.'
          else
            python tools/apply-crew-portraits-retired-delete.py
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/visual-preview.ts')
          source = path.read_text(encoding='utf-8')
          updated = source.replace('injuredUntil: null, traits:', 'injuredUntil: null, portraitKey: null, traits:')
          if updated == source and 'portraitKey: null' not in source:
              raise SystemExit('Could not update visual preview crew portraits.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit implementation when newly applied
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/admin/src/main.tsx \
            apps/api/src/routes/admin.ts \
            apps/api/src/routes/fleet.ts \
            apps/web/src/assets/crew-portraits/README.md \
            apps/web/src/crew-portraits.ts \
            apps/web/src/model.ts \
            apps/web/src/pages/fleet.tsx \
            apps/web/src/styles.css \
            apps/web/src/visual-preview.ts \
            infrastructure/database/prisma/schema.prisma \
            infrastructure/database/prisma/migrations/20260727041000_add_crew_portraits/migration.sql \
            packages/contracts/src/index.ts \
            tools/test/api-routes.test.mjs
          git commit -m 'Add crew portrait selection and retired cleanup'
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and API contracts
        run: |
          pnpm run test:repository
          pnpm run test:api

      - name: Build workspace dependencies
        run: |
          pnpm --filter @neon-wreckers/contracts run build
          pnpm --filter @neon-wreckers/integrations run build
          pnpm --filter @neon-wreckers/ui run build

      - name: Generate database client
        run: pnpm run db:generate

      - name: Build API
        run: pnpm --filter @neon-wreckers/api run build

      - name: Build player web app
        id: web-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @neon-wreckers/web run build 2>&1 | tee web-build.log

      - name: Upload web build diagnostics
        if: steps.web-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: crew-portrait-web-build-diagnostics
          path: web-build.log

      - name: Stop after web build failure
        if: steps.web-build.outcome == 'failure'
        run: exit 1

      - name: Build admin app
        run: pnpm --filter @neon-wreckers/admin run build
